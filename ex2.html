<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>환율 · 10년물 국채</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }
  .app {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 16px 44px rgba(0,0,0,0.3);
    padding: 14px;
    width: 100%;
    max-width: 460px;
  }

  /* ── 헤더: 제목 + 상태 + 컨트롤을 한 줄에 ── */
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .titles { flex: 1; min-width: 0; }
  h1 {
    font-size: 14px;
    color: #1e3c72;
    line-height: 1.2;
  }
  #status {
    font-size: 10.5px;
    color: #98a2b3;
    line-height: 1.35;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #status .ok { color: #1e8449; }
  #status .bad { color: #c0392b; }

  .ctrl { display: flex; gap: 6px; flex-shrink: 0; }
  .ctrl button {
    border: 1px solid #d8dee7;
    background: #fff;
    color: #1e3c72;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 8px;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: background 0.15s, border-color 0.15s;
  }
  .ctrl button:hover { background: #f0f3f7; border-color: #2a5298; }
  .ctrl button:focus-visible { outline: 2px solid #2a5298; outline-offset: 1px; }
  .ctrl button:disabled { opacity: 0.45; cursor: not-allowed; }
  #refreshBtn { font-size: 13px; padding: 6px 9px; }
  #refreshBtn.spin { animation: sp 0.8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #refreshBtn.spin { animation: none; }
  }

  /* ── 통합 행: 국채금리 + 환전 입력 ── */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    margin-bottom: 5px;
    background: #f5f7fa;
    border-radius: 11px;
    border: 1.5px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .row:focus-within {
    background: #fff;
    border-color: #2a5298;
  }
  .flag { font-size: 21px; flex-shrink: 0; }

  .bond { flex: 1; min-width: 0; }
  .bond-top {
    display: flex;
    align-items: baseline;
    gap: 4px;
    white-space: nowrap;
  }
  .country {
    font-size: 12.5px;
    font-weight: 700;
    color: #1e3c72;
  }
  .yield {
    font-size: 14px;
    font-weight: 700;
    color: #1e3c72;
    font-variant-numeric: tabular-nums;
  }
  .badge {
    font-size: 8.5px;
    font-weight: 700;
    padding: 1px 4px;
    border-radius: 3px;
    letter-spacing: 0.2px;
    background: #eceff3;
    color: #8a94a0;
  }
  .badge.live { background: #e3f6ea; color: #1e8449; }
  .bond-note {
    font-size: 9.5px;
    color: #98a2b3;
    line-height: 1.3;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  input[type="text"] {
    width: 108px;
    flex-shrink: 0;
    padding: 7px 8px;
    border: 1px solid #d8dee7;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: right;
    color: #1e3c72;
    background: #fff;
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  input[type="text"]:focus { border-color: #2a5298; }

  .cur {
    width: 42px;
    flex-shrink: 0;
    text-align: right;
  }
  .cur-code {
    font-size: 12px;
    font-weight: 700;
    color: #1e3c72;
    line-height: 1.2;
  }
  .cur-name {
    font-size: 9px;
    color: #98a2b3;
    line-height: 1.2;
    white-space: nowrap;
  }

  /* ── 푸터 ── */
  footer {
    margin-top: 8px;
    font-size: 9.5px;
    color: #a8b0bd;
    line-height: 1.5;
  }
  footer a { color: #6b86b8; }
  details summary {
    cursor: pointer;
    color: #98a2b3;
    margin-bottom: 4px;
  }
  details pre {
    padding: 7px;
    background: #f5f7fa;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 9px;
    line-height: 1.45;
    color: #6b7280;
    margin-bottom: 5px;
  }
  .proxy-line {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 5px;
  }
  .proxy-line label { cursor: pointer; }

  @media (max-width: 400px) {
    .app { padding: 11px; }
    input[type="text"] { width: 86px; font-size: 13px; padding: 6px 7px; }
    .flag { font-size: 19px; }
    .country { font-size: 11.5px; }
    .yield { font-size: 13px; }
    .cur { width: 38px; }
    .row { gap: 6px; padding: 6px 8px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="titles">
      <h1>환율 · 10년물 국채</h1>
      <div id="status">불러오는 중…</div>
    </div>
    <div class="ctrl">
      <button id="fmtBtn" title="숫자 표기 방식 바꾸기">1,234.56</button>
      <button id="refreshBtn" title="환율·금리 새로고침" aria-label="새로고침">↻</button>
    </div>
  </header>

  <div id="rows"></div>

  <footer>
    <details id="diag" hidden>
      <summary>조회 실패 상세</summary>
      <pre id="diagBody"></pre>
    </details>
    금리 출처: <a href="https://data.ecb.europa.eu/help/api/data" target="_blank" rel="noopener">ECB</a> ·
    <a href="https://developer.api.riksbank.se/apis" target="_blank" rel="noopener">Riksbank</a> ·
    <a href="https://stooq.com/" target="_blank" rel="noopener">stooq</a>(프록시 경유) · 환율 open.er-api.com
    <div class="proxy-line">
      <input type="checkbox" id="proxyToggle" checked>
      <label for="proxyToggle">CORS 프록시 사용 (끄면 유로존·스웨덴만 실시간)</label>
    </div>
  </footer>

</div>

<script>
  // ═══════════════════════════════════════════════════════
  // 통화 + 10년물 국채를 한 행으로 합친 데이터
  //   value/date = 조회 실패 시 표시할 기준값(Trading Economics)
  // ═══════════════════════════════════════════════════════
  const ITEMS = [
    { cur:'KRW', curName:'한국 원',       dec:0, flag:'🇰🇷', cc:'KR', country:'대한민국', note:'국고채 10년',     value:4.39, date:'2026-09-08', src:null },
    { cur:'SEK', curName:'크로나',        dec:2, flag:'🇸🇪', cc:'SE', country:'스웨덴',   note:'Swedish 10Y',     value:3.08, date:'2026-09-08', src:null },
    { cur:'USD', curName:'달러',          dec:2, flag:'🇺🇸', cc:'US', country:'미국',     note:'US Treasury 10Y', value:4.80, date:'2026-09-09', src:null },
    { cur:'CNY', curName:'위안',          dec:2, flag:'🇨🇳', cc:'CN', country:'중국',     note:'China 10Y',       value:1.68, date:'2026-09-09', src:null },
    { cur:'EUR', curName:'유로',          dec:2, flag:'🇪🇺', cc:'EU', country:'유로존',   note:'독일 Bund 10Y',   value:3.42, date:'2026-09-09', src:null },
    { cur:'GBP', curName:'파운드',        dec:2, flag:'🇬🇧', cc:'GB', country:'영국',     note:'UK Gilt 10Y',     value:5.24, date:'2026-09-09', src:null }
  ];

  const CURRENCIES = ITEMS.map(i => i.cur);
  const DECIMALS = Object.fromEntries(ITEMS.map(i => [i.cur, i.dec]));

  let rates = { KRW:1, SEK:0.0068, USD:0.00072, CNY:0.0052, EUR:0.00062, GBP:0.00053 };
  let formatMode = 'US';          // 'US' = 1,234.56 / 'EU' = 1 234,56
  let isUpdating = false;
  let rateMsg = '', bondMsg = '';

  const PROXY = {
    enabled: true,
    build: url => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
  };
  const STOOQ_SYMBOL = { KR:'10YKRY.B', SE:'10YSEY.B', US:'10YUSY.B', CN:'10YCNY.B', DE:'10YDEY.B', GB:'10YUKY.B' };

  // ── 행 그리기 (한 번만. 이후엔 금리 부분만 갱신해서 입력값이 안 지워짐)
  function buildRows() {
    document.getElementById('rows').innerHTML = ITEMS.map(i => `
      <div class="row">
        <div class="flag">${i.flag}</div>
        <div class="bond">
          <div class="bond-top">
            <span class="country">${i.country}</span>
            <span class="badge" id="badge-${i.cc}">수동</span>
            <span class="yield" id="yield-${i.cc}">${i.value.toFixed(2)}%</span>
          </div>
          <div class="bond-note" id="note-${i.cc}">${i.note} · ${i.date}</div>
        </div>
        <input type="text" id="${i.cur}" data-code="${i.cur}" placeholder="0" inputmode="decimal"
               aria-label="${i.curName} 금액">
        <div class="cur">
          <div class="cur-code">${i.cur}</div>
          <div class="cur-name">${i.curName}</div>
        </div>
      </div>
    `).join('');
    bindInputs();
  }

  function paintBond(i) {
    document.getElementById('yield-' + i.cc).textContent = i.value.toFixed(2) + '%';
    document.getElementById('note-' + i.cc).textContent = i.note + (i.date ? ' · ' + i.date : '');
    const b = document.getElementById('badge-' + i.cc);
    b.textContent = i.src || '수동';
    b.className = 'badge' + (i.src ? ' live' : '');
  }

  function paintStatus() {
    document.getElementById('status').innerHTML = [rateMsg, bondMsg].filter(Boolean).join(' · ');
  }

  // ═══════════════ 숫자 포맷 ═══════════════
  function getSeparators() {
    return formatMode === 'EU'
      ? { thousand: '\u00A0', decimal: ',' }
      : { thousand: ',',      decimal: '.' };
  }

  function formatNumber(value, decimals) {
    if (isNaN(value) || value === null) return '';
    const sep = getSeparators();
    let [intPart, decPart] = value.toFixed(decimals).split('.');
    const isNeg = intPart.startsWith('-');
    if (isNeg) intPart = intPart.slice(1);
    let out = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, sep.thousand);
    if (decPart) out += sep.decimal + decPart;
    return isNeg ? '-' + out : out;
  }

  function formatWhileTyping(rawStr) {
    if (rawStr === '' || rawStr === '-') return rawStr;
    const sep = getSeparators();
    const isNegative = rawStr.startsWith('-');
    let s = isNegative ? rawStr.slice(1) : rawStr;

    if (sep.thousand === '\u00A0') s = s.replace(/[\s\u00A0]/g, '');
    else s = s.split(sep.thousand).join('');

    if (formatMode === 'EU') {
      s = s.replace(/\./g, ',').replace(/[^\d,]/g, '');
      const f = s.indexOf(',');
      if (f !== -1) s = s.slice(0, f + 1) + s.slice(f + 1).replace(/,/g, '');
    } else {
      s = s.replace(/[^\d.]/g, '');
      const f = s.indexOf('.');
      if (f !== -1) s = s.slice(0, f + 1) + s.slice(f + 1).replace(/\./g, '');
    }

    let [intPart, decPart] = formatMode === 'EU' ? s.split(',') : s.split('.');
    intPart = (intPart || '').replace(/^0+(?=\d)/, '');
    if (intPart === '') intPart = decPart !== undefined ? '0' : '';

    let out = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, sep.thousand);
    if (decPart !== undefined) out += sep.decimal + decPart;
    return isNegative ? '-' + out : out;
  }

  function parseNumber(str) {
    if (!str) return NaN;
    const sep = getSeparators();
    let s = sep.thousand === '\u00A0'
      ? str.replace(/[\s\u00A0]/g, '')
      : str.split(sep.thousand).join('');
    if (sep.decimal === ',') s = s.replace(',', '.');
    return parseFloat(s);
  }

  // ═══════════════ 환전 ═══════════════
  function updateAll(sourceInput) {
    if (isUpdating) return;
    isUpdating = true;

    const sourceCode = sourceInput.dataset.code;
    const sourceValue = parseNumber(sourceInput.value);

    document.querySelectorAll('input[type="text"]').forEach(i => i.dataset.hasValue = 'false');

    if (isNaN(sourceValue) || sourceInput.value === '' || sourceInput.value === '-') {
      CURRENCIES.forEach(c => { if (c !== sourceCode) document.getElementById(c).value = ''; });
      isUpdating = false;
      return;
    }

    sourceInput.dataset.hasValue = 'true';
    const inKRW = sourceValue / rates[sourceCode];
    CURRENCIES.forEach(c => {
      if (c !== sourceCode) document.getElementById(c).value = formatNumber(inKRW * rates[c], DECIMALS[c]);
    });

    isUpdating = false;
  }

  function bindInputs() {
    CURRENCIES.forEach(code => {
      const input = document.getElementById(code);

      input.addEventListener('input', e => {
        const oldValue = e.target.value;
        const oldCursor = e.target.selectionStart;
        const sep = getSeparators();
        const meaningful = sep.decimal === ',' ? /[\d,]/ : /[\d.]/;
        let count = 0;
        for (const ch of oldValue.slice(0, oldCursor)) if (meaningful.test(ch)) count++;

        const formatted = formatWhileTyping(oldValue);
        e.target.value = formatted;

        let newCursor = formatted.length, seen = 0;
        for (let i = 0; i < formatted.length; i++) {
          if (meaningful.test(formatted[i])) {
            seen++;
            if (seen === count) { newCursor = i + 1; break; }
          }
        }
        try { e.target.setSelectionRange(newCursor, newCursor); } catch (_) {}

        updateAll(input);
      });

      input.addEventListener('blur', e => {
        const v = parseNumber(e.target.value);
        if (!isNaN(v) && e.target.value !== '') e.target.value = formatNumber(v, DECIMALS[code]);
      });
    });
  }

  async function fetchRates() {
    rateMsg = '환율 불러오는 중…';
    paintStatus();
    try {
      const res = await fetch('https://open.er-api.com/v6/latest/KRW');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (data.result !== 'success') throw new Error('데이터 오류');

      rates.KRW = 1;
      ['SEK','USD','CNY','EUR','GBP'].forEach(c => rates[c] = data.rates[c]);

      const d = new Date(data.time_last_update_utc);
      rateMsg = '<span class="ok">환율 ' + d.toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' }) + '</span>';

      const filled = document.querySelector('input[data-has-value="true"]');
      if (filled) updateAll(filled);
    } catch (err) {
      console.error(err);
      rateMsg = '<span class="bad">환율 실패 · 기본값</span>';
    }
    paintStatus();
  }

  // ═══════════════ 국채 금리 ═══════════════
  const BOND_SOURCES = {
    KR: [['stooq', () => fetchStooq('KR')]],
    SE: [['Riksbank', fetchRiksbank], ['stooq', () => fetchStooq('SE')]],
    US: [['stooq', () => fetchStooq('US')]],
    CN: [['stooq', () => fetchStooq('CN')]],
    EU: [['ECB', fetchECB], ['stooq', () => fetchStooq('DE')]],
    GB: [['stooq', () => fetchStooq('GB')]]
  };

  function splitCsvLine(line) {
    const out = [];
    let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (ch === ',' && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(s => s.trim());
  }

  function withTimeout(p, ms, label) {
    return Promise.race([p, new Promise((_, rej) =>
      setTimeout(() => rej(new Error(label + ' 응답 없음 (' + ms + 'ms)')), ms))]);
  }

  async function fetchECB() {
    const url = 'https://data-api.ecb.europa.eu/service/data/FM/D.U2.EUR.4F.BB.U2_10Y.YLD?lastNObservations=1&format=csvdata';
    const res = await withTimeout(fetch(url, { cache:'no-store' }), 8000, 'ECB');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const lines = (await res.text()).trim().split(/\r?\n/);
    if (lines.length < 2) throw new Error('빈 응답');
    const h = splitCsvLine(lines[0]), r = splitCsvLine(lines[lines.length - 1]);
    const v = parseFloat(r[h.indexOf('OBS_VALUE')]);
    if (!isFinite(v)) throw new Error('값 파싱 실패');
    const ti = h.indexOf('TIME_PERIOD');
    return { value: v, date: ti >= 0 ? r[ti] : '', note: '유로존 AAA 10Y' };
  }

  async function fetchRiksbank() {
    const res = await withTimeout(
      fetch('https://api.riksbank.se/swea/v1/Observations/Latest/SEGVB10YC', { cache:'no-store' }), 8000, 'Riksbank');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    const o = Array.isArray(d) ? d[d.length - 1] : d;
    const v = parseFloat(o.value !== undefined ? o.value : o.Value);
    if (!isFinite(v)) throw new Error('값 파싱 실패');
    return { value: v, date: o.date || o.Date || '' };
  }

  async function fetchStooq(cc) {
    if (!PROXY.enabled) throw new Error('프록시 꺼짐');
    const sym = STOOQ_SYMBOL[cc];
    if (!sym) throw new Error('심볼 없음');
    const target = 'https://stooq.com/q/l/?s=' + sym.toLowerCase() + '&f=sd2t2ohlcv&h&e=csv';
    const res = await withTimeout(fetch(PROXY.build(target), { cache:'no-store' }), 12000, 'stooq');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const lines = (await res.text()).trim().split(/\r?\n/);
    if (lines.length < 2) throw new Error('빈 응답');
    const h = splitCsvLine(lines[0]).map(s => s.toLowerCase()), r = splitCsvLine(lines[1]);
    const ci = h.indexOf('close');
    if (ci < 0) throw new Error('close 컬럼 없음');
    const v = parseFloat(r[ci]);
    if (!isFinite(v)) throw new Error('값 없음');
    const di = h.indexOf('date');
    return { value: v, date: di >= 0 ? r[di] : '' };
  }

  async function resolveBond(i) {
    const errs = [];
    for (const [name, fn] of (BOND_SOURCES[i.cc] || [])) {
      try { return { ...(await fn()), src: name }; }
      catch (e) { errs.push(name + ' → ' + e.message); }
    }
    throw new Error(errs.join(' / ') || '소스 없음');
  }

  async function fetchBonds() {
    bondMsg = '금리 불러오는 중…';
    paintStatus();

    const results = await Promise.allSettled(ITEMS.map(resolveBond));
    const failures = [];

    results.forEach((r, idx) => {
      const i = ITEMS[idx];
      if (r.status === 'fulfilled') {
        i.value = r.value.value;
        if (r.value.date) i.date = r.value.date;
        if (r.value.note) i.note = r.value.note;
        i.src = r.value.src;
      } else {
        i.src = null;
        failures.push(i.country + '\n  ' + r.reason.message);
      }
      paintBond(i);
    });

    const ok = ITEMS.filter(i => i.src).length;
    bondMsg = ok === ITEMS.length
      ? '<span class="ok">금리 ' + ok + '/6 실시간</span>'
      : '<span class="bad">금리 ' + ok + '/6 실시간</span>';
    paintStatus();

    const diag = document.getElementById('diag');
    diag.hidden = failures.length === 0;
    document.getElementById('diagBody').textContent = failures.join('\n\n');
  }

  // ═══════════════ 컨트롤 ═══════════════
  const fmtBtn = document.getElementById('fmtBtn');
  fmtBtn.addEventListener('click', () => {
    const old = {};
    CURRENCIES.forEach(c => old[c] = parseNumber(document.getElementById(c).value));

    formatMode = formatMode === 'US' ? 'EU' : 'US';
    fmtBtn.textContent = formatMode === 'EU' ? '1\u00A0234,56' : '1,234.56';

    CURRENCIES.forEach(c => {
      const v = old[c];
      if (!isNaN(v)) document.getElementById(c).value = formatNumber(v, DECIMALS[c]);
    });
  });

  const refreshBtn = document.getElementById('refreshBtn');
  async function refreshAll() {
    refreshBtn.disabled = true;
    refreshBtn.classList.add('spin');
    await Promise.all([fetchRates(), fetchBonds()]);
    refreshBtn.classList.remove('spin');
    refreshBtn.disabled = false;
  }
  refreshBtn.addEventListener('click', refreshAll);

  document.getElementById('proxyToggle').addEventListener('change', e => {
    PROXY.enabled = e.target.checked;
    fetchBonds();
  });

  buildRows();
  refreshAll();
</script>
</body>
</html>
